name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Feature matrix for the core crate: prove the default build stays lean
      # and that each routing feature builds in isolation and together.
      - name: build core (no default features)
        run: cargo build -p liteforge --no-default-features
      - name: build core (routing)
        run: cargo build -p liteforge --features routing
      - name: build core (model-routing)
        run: cargo build -p liteforge --features model-routing
      - name: build core (model-routing,otel)
        run: cargo build -p liteforge --features model-routing,otel

      - name: clippy (model-routing)
        run: cargo clippy -p liteforge --features model-routing -- -D warnings

      - name: test core (model-routing)
        run: cargo test -p liteforge --features model-routing

      - name: build workspace
        run: cargo build --workspace

      - name: run routing example
        run: cargo run -p liteforge --features model-routing --example routing
